version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# DealFlow360 — Docker Compose Production Stack
#
# Services:
#   postgres  → PostgreSQL 16 (Primary authoritative source of truth)
#   redis     → Redis 7 (Caching, rate limiting, idempotency, job coordination)
#   backend   → Node.js/Express API server
#   frontend  → React SPA served via nginx (proxies /api to backend)
#
# Setup:
#   1. Copy backend/.env.example to backend/.env and configure secrets
#   2. docker compose up -d
#   3. docker compose exec backend npm run seed:demo
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL (Primary Source of Truth) ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dealflow360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-dealflow360}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dealflow360}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis (Cache / Rate Limiting / Idempotency / Job Queue) ───────────────
  redis:
    image: redis:7-alpine
    container_name: dealflow360-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend API (Stateless Node.js/Express) ────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dealflow360-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-dealflow360}
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:80
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/health').then(r => process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend (React SPA via nginx — proxies /api to backend) ──────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dealflow360-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:

version: '3.8'

services:
  # PostgreSQL Database (Primary Transactional Source of Truth - Point 3)
  postgres:
    image: postgres:16-alpine
    container_name: dealflow360-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: dealflow360
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dealflow360"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Distributed Lock/Rate Limiter (Point 6 & 11)
  redis:
    image: redis:7-alpine
    container_name: dealflow360-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # Stateless API Server (Point 1 & 2)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dealflow360-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/dealflow360
      REDIS_URL: redis://redis:6379
      LOG_FORMAT: json
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Frontend Web UI (Point 1 & 22)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dealflow360-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
